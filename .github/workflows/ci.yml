name: CI

on:
  push:
    branches: [develop, staging, production]
  pull_request:
    branches: [develop, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: lint · typecheck · test · bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # wrangler types lee .dev.vars para tipar los secretos; en CI usamos el ejemplo.
      - run: cp .dev.vars.example .dev.vars

      - name: Tipos de bindings al día
        run: npx wrangler types --check

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Bundle compila (deploy en seco)
        run: npx wrangler deploy --dry-run --outdir dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
